
data:
  path: data/adult_train.csv
  target: income_over_50k
  sensitive_attr: sex
  drop_columns:
  - id
  - fnlwgt
  - education
  - race
test_set:
  size: 0.2
  random_state: 42
cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  metrics:
  - accuracy
  - balanced_accuracy
  - precision
  - recall
  - f1
  - fbeta_2
  - roc_auc
  - average_precision
  selection_metric: roc_auc
  n_jobs: 1
diagnostics:
  id_column: id
  numeric_text_columns: []
  placeholder_tokens:
  - '?'
  - ''
  - nan
  - N/A
  placeholder_columns:
  - workclass
  - occupation
  - native_country
  validity_rules:
    age:
      min: 17
      max: 90
    hours_per_week:
      min: 1
      max: 99
    capital_gain:
      min: 0
    capital_loss:
      min: 0
  canonical_categories: {}
  redundant_columns: []
preprocessing:
  encoder: onehot
  scaler: robust
  numeric_features:
  - age
  - education_num
  - capital_gain
  - capital_loss
  - hours_per_week
  - v01
  - v02
  - v03
  - v04
  - v05
  - v06
  - v07
  - v08
  - v09
  - v10
  - v11
  - v12
  - v13
  - v14
  - v15
  - v16
  - v17
  - v18
  categorical_features:
  - workclass
  - marital_status
  - occupation
  - relationship
  - native_country
  - v19
  - v20
  - v21
  - v22
  - v23
  - v24
  - v25
  mnar_indicator_sources:
  - workclass
  - occupation
  random_state: 42
  imputation:
    numeric_strategy: median
    categorical_strategy: most_frequent
feature_engineering:
  enabled: false
  numeric_features:
  - juvenile_offenses_total
  - priors_per_adult_year
  - adult_juvenile_interaction
model:
  type: xgboost
  params:
    n_estimators: 450
    learning_rate: 0.045
    max_depth: 3
    min_child_weight: 2
    subsample: 0.85
    colsample_bytree: 0.85
    reg_lambda: 2.0
    random_state: 42
    n_jobs: -1
    eval_metric: logloss
feature_selection:
  enabled: true
  min_votes: 2
  random_state: 42
  search_space:
    select__min_votes:
      type: int
      low: 1
      high: 3
tuning:
  enabled: false
  n_trials: 3
  n_splits: 5
  random_state: 42
  search_spaces:
    logistic_regression:
      model__C:
        type: float
        low: 0.01
        high: 100.0
        log: true
    adaboost_logistic:
      model__n_estimators:
        type: int
        low: 10
        high: 80
      model__learning_rate:
        type: float
        low: 0.05
        high: 1.0
        log: true
    decision_tree:
      model__max_depth:
        type: int
        low: 1
        high: 20
      model__min_samples_leaf:
        type: int
        low: 1
        high: 200
        log: true
      model__criterion:
        type: categorical
        choices:
        - gini
        - entropy
    random_forest:
      model__max_depth:
        type: int
        low: 2
        high: 30
      model__min_samples_leaf:
        type: int
        low: 1
        high: 200
        log: true
      model__max_features:
        type: categorical
        choices:
        - sqrt
        - 0.5
        - 1.0
    oblique_random_forest:
      model__estimator__tree__max_depth:
        type: int
        low: 2
        high: 30
      model__estimator__tree__min_samples_leaf:
        type: int
        low: 1
        high: 200
        log: true
      model__estimator__project__n_components:
        type: int
        low: 3
        high: 10
    adaboost:
      model__estimator__max_depth:
        type: int
        low: 1
        high: 8
      model__n_estimators:
        type: int
        low: 25
        high: 400
        log: true
      model__learning_rate:
        type: float
        low: 0.01
        high: 1.0
        log: true
    gradient_boosting:
      model__n_estimators:
        type: int
        low: 25
        high: 500
        log: true
      model__learning_rate:
        type: float
        low: 0.01
        high: 0.5
        log: true
      model__max_depth:
        type: int
        low: 1
        high: 6
      model__min_samples_leaf:
        type: int
        low: 1
        high: 200
        log: true
      model__subsample:
        type: float
        low: 0.5
        high: 1.0
    hist_gradient_boosting:
      model__max_iter:
        type: int
        low: 25
        high: 500
        log: true
      model__learning_rate:
        type: float
        low: 0.01
        high: 0.5
        log: true
      model__max_leaf_nodes:
        type: int
        low: 2
        high: 63
        log: true
      model__min_samples_leaf:
        type: int
        low: 5
        high: 200
        log: true
      model__l2_regularization:
        type: float
        low: 1.0e-06
        high: 10.0
        log: true
    xgboost:
      model__n_estimators:
        type: int
        low: 50
        high: 600
        log: true
      model__learning_rate:
        type: float
        low: 0.01
        high: 0.3
        log: true
      model__max_depth:
        type: int
        low: 1
        high: 8
      model__min_child_weight:
        type: float
        low: 1.0
        high: 50.0
        log: true
      model__subsample:
        type: float
        low: 0.5
        high: 1.0
      model__colsample_bytree:
        type: float
        low: 0.5
        high: 1.0
      model__reg_lambda:
        type: float
        low: 0.01
        high: 10.0
        log: true
      model__reg_alpha:
        type: float
        low: 0.001
        high: 10.0
        log: true
      model__gamma:
        type: float
        low: 0.0
        high: 5.0
    naive_bayes:
      model__var_smoothing:
        type: float
        low: 1.0e-12
        high: 0.1
        log: true
output:
  results_dir: results/adult_fs
  scoreboard: results/adult_fs/runs.csv
prediction:
  path: data/adult_new.csv
  output: results/adult_fs/adult_predictions.csv
  threshold: 0.5
